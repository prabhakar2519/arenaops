# Development-only overrides. Common settings remain in application.yaml.
spring:
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  datasource:
    url: jdbc:postgresql://${ARENA_DB_HOST:localhost}:5432/${ARENA_DB_NAME}
  mail:
    username: ${BREVO_SMTP_USERNAME:}
    password: ${BREVO_SMTP_PASSWORD:}

app:
  email:
    enabled: ${ARENAOPS_MAIL_ENABLED:true}
    from: ${ARENAOPS_MAIL_FROM:noreply@arenaops.in}
    from-name: ${ARENAOPS_MAIL_FROM_NAME:ArenaOps}
    reply-to: ${ARENAOPS_MAIL_REPLY_TO:}
    frontend-url: ${ARENAOPS_FRONTEND_URL:${APP_BASE_URL:http://localhost:4200}}


logging:
  level:
    com.arena: DEBUG
