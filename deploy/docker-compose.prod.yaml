name: arenaops-app

services:
  arena-core:
    image: ${IMAGE_REPOSITORY}/arena-core:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ${ARENAOPS_APP_ENV_FILE:-/opt/arenaops/config/app.env}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ARENA_CORE_URL: http://arena-core:7701
    networks: [arenaops]

  arena-login:
    image: ${IMAGE_REPOSITORY}/arena-login:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - arena-core
    env_file:
      - ${ARENAOPS_APP_ENV_FILE:-/opt/arenaops/config/app.env}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ARENA_CORE_URL: http://arena-core:7701
    networks: [arenaops]

  arena-ui:
    image: ${IMAGE_REPOSITORY}/arena-ui:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - arena-login
    ports:
      - "127.0.0.1:8081:80"
    networks: [arenaops]

networks:
  arenaops:
    external: true
    name: arenaops
