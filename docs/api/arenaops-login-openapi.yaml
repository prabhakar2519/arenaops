components:
  schemas:
    ErrorResponse:
      properties:
        conflicts:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
        correlationId:
          type: string
        description:
          type: string
        errorCode:
          type: string
          enum:
          - FACILITY_INVALID_REQUEST
          - FACILITY_VERSION_CONFLICT
          - FACILITY_CAPABILITY_DISABLED
          - FACILITY_UNSUPPORTED
          - FACILITY_NOT_FOUND
          - FACILITY_IDEMPOTENCY_CONFLICT
          - FACILITY_COMMITMENT_EXISTS
          - FACILITY_NOT_ELIGIBLE
          - FACILITY_CONCURRENCY_FAILURE
          - SINGLE_SPORT_LIMIT_EXCEEDED
          - SPORT_SESSION_ACTIVE
          - SPORT_RESERVATION_EXISTS
          - TRAINING_SPORT_DUPLICATE
          - TRAINING_DEPENDENCY_EXISTS
          - INVALID_LOGO
          - LOGO_TOO_LARGE
          - INVALID_REQUEST
          - VALIDATION_FAILED
          - AUTHENTICATION_REQUIRED
          - AUTHENTICATION_FAILED
          - ACCESS_DENIED
          - USER_DISABLED
          - CUSTOMER_ACCESS_BLOCKED
          - SUBSCRIPTION_EXPIRED
          - SUBSCRIPTION_ACCESS_BLOCKED
          - PAYMENT_REQUIRED
          - CUSTOMER_NOT_FOUND
          - CUSTOMER_ALREADY_EXISTS
          - DUPLICATE_USERNAME
          - DUPLICATE_EMAIL
          - STAFF_REGISTRATION_UNCERTAIN
          - USER_ALREADY_EXISTS
          - INVITATION_NOT_FOUND
          - INVITATION_INVALID
          - INVITATION_EXPIRED
          - INVITATION_ALREADY_CONSUMED
          - INVITATION_REVOKED
          - INVITATION_EMAIL_MISMATCH
          - INVITATION_NOT_READY
          - SUBSCRIPTION_NOT_FOUND
          - SUBSCRIPTION_CANCELLED
          - GRACE_PERIOD_ALREADY_ACTIVE
          - GRACE_PERIOD_NOT_ALLOWED
          - INVALID_GRACE_END
          - PUBLIC_BOOKING_INVALID_MOBILE
          - PUBLIC_BOOKING_INVALID_TIME
          - PUBLIC_BOOKING_TIME_INCREMENT
          - PUBLIC_BOOKING_WINDOW
          - PUBLIC_BOOKING_OUTSIDE_HOURS
          - PUBLIC_BOOKING_DURATION
          - PUBLIC_BOOKING_DISABLED
          - PUBLIC_BOOKING_INVALID_DETAILS
          - PUBLIC_BOOKING_FACILITY_UNAVAILABLE
          - PUBLIC_BOOKING_CONFLICT
          - PUBLIC_SLUG_INVALID
          - PUBLIC_SLUG_UNAVAILABLE
          - PUBLIC_SLUG_CHANGE_NOT_ALLOWED
          - PUBLIC_SITE_NOT_PUBLISHED
          - INVALID_STATE
          - RESOURCE_NOT_FOUND
          - QR_CHECKIN_UNAVAILABLE
          - TOO_MANY_REQUESTS
          - SESSION_QUOTE_STALE
          - CONFLICT
          - EMAIL_DISABLED
          - EMAIL_DELIVERY_FAILED
          - IDENTITY_PROVIDER_UNAVAILABLE
          - IDENTITY_CREATION_FAILED
          - SERVICE_UNAVAILABLE
          - INTERNAL_SERVER_ERROR
          - METHOD_NOT_ALLOWED
          - UNSUPPORTED_MEDIA_TYPE
          - NOT_ACCEPTABLE
        fieldErrors:
          type: object
          additionalProperties: {}
          description: Validation errors keyed by field name.
        path:
          type: string
        reasonCode:
          type: string
        status:
          type: integer
          format: int32
        timestamp:
          type: string
    PrincipalState:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          type: object
          additionalProperties: {}
    Readiness:
      type: object
      properties:
        status:
          type: string
          example: UP
    ServiceStatus:
      type: object
      properties:
        service:
          type: string
          example: arena-login
        status:
          type: string
          example: ready
    TokenRequest:
      type: object
      properties:
        code:
          type: string
          description: Synthetic example only; never persist or log this value in
            documentation
          minLength: 1
          writeOnly: true
        codeVerifier:
          type: string
          description: Synthetic example only; never persist or log this value in
            documentation
          minLength: 1
          pattern: "[A-Za-z0-9._~-]{43,128}"
          writeOnly: true
        redirectUri:
          type:
          - string
          - "null"
      required:
      - code
      - codeVerifier
    UserInfo:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
        roles:
          type: array
          items:
            type: string
        username:
          type: string
  securitySchemes:
    sessionCookie:
      description: Session established by POST /api/token; tokens remain server-side.
      in: cookie
      name: JSESSIONID
      type: apiKey
x-error-catalog:
  ACCESS_DENIED:
    description: You do not have permission to perform this operation.
    status: 403
  AUTHENTICATION_FAILED:
    description: Your sign-in session is invalid or expired. Please sign in again.
    status: 401
  AUTHENTICATION_REQUIRED:
    description: Please sign in to continue.
    status: 401
  CONFLICT:
    description: The operation conflicts with existing data. Please refresh and try
      again.
    status: 409
  CUSTOMER_ACCESS_BLOCKED:
    description: Your ArenaOps account does not currently have access. Please contact
      your administrator.
    status: 403
  CUSTOMER_ALREADY_EXISTS:
    description: A customer already exists with this email.
    status: 409
  CUSTOMER_NOT_FOUND:
    description: Customer with the supplied identifier was not found.
    status: 404
  DUPLICATE_EMAIL:
    description: An account already uses this email address. Enter a different email.
    status: 409
  DUPLICATE_USERNAME:
    description: This username is already in use. Choose another username.
    status: 409
  EMAIL_DELIVERY_FAILED:
    description: The invitation email could not be sent. Please retry the invitation.
    status: 503
  EMAIL_DISABLED:
    description: Invitation email was not sent because email delivery is currently
      disabled.
    status: 503
  FACILITY_CAPABILITY_DISABLED:
    description: Enable Play & Facility Access on the active registered sport before
      configuring facilities.
    status: 409
  FACILITY_COMMITMENT_EXISTS:
    description: Ongoing or future commitments prevent this facility change.
    status: 409
  FACILITY_CONCURRENCY_FAILURE:
    description: Concurrent facility changes prevented this operation. Refresh and
      retry safely.
    status: 409
  FACILITY_IDEMPOTENCY_CONFLICT:
    description: This operation key was already used with a different request. Reconcile
      the original operation first.
    status: 409
  FACILITY_INVALID_REQUEST:
    description: Review the highlighted facility fields.
    status: 400
  FACILITY_NOT_ELIGIBLE:
    description: This facility is inactive or its pricing is incomplete.
    status: 409
  FACILITY_NOT_FOUND:
    description: The facility was not found.
    status: 404
  FACILITY_UNSUPPORTED:
    description: This sport or facility type is not operationally supported.
    status: 400
  FACILITY_VERSION_CONFLICT:
    description: A facility was modified by another user. Review the latest configuration
      before saving.
    status: 409
  GRACE_PERIOD_ALREADY_ACTIVE:
    description: Customer already has an active grace period.
    status: 409
  GRACE_PERIOD_NOT_ALLOWED:
    description: Grace period can only be granted when payment is due.
    status: 409
  IDENTITY_CREATION_FAILED:
    description: Your account could not be created in the sign-in service. Please
      try again.
    status: 502
  IDENTITY_PROVIDER_UNAVAILABLE:
    description: Sign-in services are temporarily unavailable. Please try again shortly.
    status: 503
  INTERNAL_SERVER_ERROR:
    description: An unexpected error occurred while processing the request.
    status: 500
  INVALID_GRACE_END:
    description: Grace period end must be in the future.
    status: 400
  INVALID_LOGO:
    description: "Upload a valid PNG, JPEG or WebP image (maximum 4096 pixels per\
      \ side and 4 megapixels)."
    status: 400
  INVALID_REQUEST:
    description: The request is invalid.
    status: 400
  INVALID_STATE:
    description: This operation is not allowed in the current state.
    status: 409
  INVITATION_ALREADY_CONSUMED:
    description: This invitation has already been used.
    status: 409
  INVITATION_EMAIL_MISMATCH:
    description: Registration email must match the invited email.
    status: 400
  INVITATION_EXPIRED:
    description: This invitation has expired. Please request a new invitation.
    status: 409
  INVITATION_INVALID:
    description: The activation code is invalid.
    status: 400
  INVITATION_NOT_FOUND:
    description: No invitation was found.
    status: 404
  INVITATION_NOT_READY:
    description: This invitation is not available for registration.
    status: 409
  INVITATION_REVOKED:
    description: This invitation has been revoked. Please request a new invitation.
    status: 409
  LOGO_TOO_LARGE:
    description: The logo upload exceeds the allowed request size.
    status: 413
  METHOD_NOT_ALLOWED:
    description: This request method is not supported.
    status: 405
  NOT_ACCEPTABLE:
    description: The requested response format is not supported.
    status: 406
  PAYMENT_REQUIRED:
