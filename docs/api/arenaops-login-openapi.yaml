      time or facility.
    status: 409
  PUBLIC_BOOKING_DISABLED:
    description: This club is not accepting reservation requests right now.
    status: 400
  PUBLIC_BOOKING_DURATION:
    description: Choose one of the booking durations offered by this club.
    status: 400
  PUBLIC_BOOKING_FACILITY_UNAVAILABLE:
    description: That facility is unavailable for booking. Refresh and choose an available
      facility.
    status: 404
  PUBLIC_BOOKING_INVALID_DETAILS:
    description: Check the required booking details and use a local date and time
      without a timezone suffix.
    status: 400
  PUBLIC_BOOKING_INVALID_MOBILE:
    description: "Enter a valid mobile number with its country code, for example +919876543210."
    status: 400
  PUBLIC_BOOKING_INVALID_TIME:
