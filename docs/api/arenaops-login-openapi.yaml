    status: 409
  PUBLIC_SLUG_INVALID:
    description: "Choose a 3–40 character address using letters, numbers and single\
      \ hyphens. System addresses are reserved."
    status: 400
  PUBLIC_SLUG_UNAVAILABLE:
    description: This website address is already assigned to another club. Choose
