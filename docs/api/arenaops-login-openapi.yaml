    description: The entire reservation must fit within the club opening hours.
    status: 400
  PUBLIC_BOOKING_TIME_INCREMENT:
    description: "Choose a start time at :00, :15, :30 or :45, with no seconds."
    status: 400
  PUBLIC_BOOKING_WINDOW:
    description: Choose a start time at least 15 minutes and no more than 30 days
