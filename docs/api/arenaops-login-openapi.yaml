openapi: 3.1.0
info:
  description: "Code-first reference. Relative server is the current service origin.\
    \ BFF session cookie, not a bearer token. Obtain the session through the existing\
    \ browser PKCE flow; Swagger does not collect passwords. See Core specification\
    \ for delegated resource APIs. Documentation access is separate from API authorization.\
    \ Keycloak-native email verification/password setup is not an ArenaOps REST API.\
    \ The global /error dispatch and implicit HEAD/OPTIONS are described in docs/api/README.md."
  title: ArenaOps Login / BFF API
  version: 1.0.0
servers:
- description: Current service origin
  url: /
paths:
  /:
    get:
      description: Service metadata. Login root is public; Core root requires JWT.
        Health endpoint is public. /api/me reports whether a Spring OAuth2 principal
        exists and does not establish a BFF session. /register redirects to the configured
        frontend registration page.
      operationId: HomeController_home_get__
      responses:
        "200":
          content:
            application/json:
              example:
                service: arena-login
                status: ready
              schema:
                $ref: "#/components/schemas/ServiceStatus"
          description: Service response
        "500":
          content:
            application/json:
              examples:
                INTERNAL_SERVER_ERROR:
                  description: Retry only when safe; retain idempotency keys for uncertain
                    creation results. Supply the correlation ID to support.
                  summary: INTERNAL_SERVER_ERROR
                  value:
                    correlationId: 00000000-0000-4000-8000-000000000001
                    description: An unexpected error occurred while processing the
                      request.
                    errorCode: INTERNAL_SERVER_ERROR
                    path: /
                    status: 500
                    timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request rejected; see named examples for error codes and recovery
            guidance.
      security: []
      summary: Get service metadata
      tags:
      - Service metadata
      x-handler: com.arena.login.controller.HomeController#home
