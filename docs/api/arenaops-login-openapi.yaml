  /api/token:
    post:
      description: "BFF routes have /api-prefixed and root aliases, including supported\
        \ trailing slashes. Bearer tokens remain server-side in the JSESSIONID session.\
        \ Downstream Core errors are sanitized; facility conflicts and field errors\
        \ are retained. Public authorization-code exchange using the existing PKCE\
        \ verifier. The authorization code is single-use; never replay it after an\
        \ uncertain response. Returns UserInfo, never TokenResponse. Establishes a\
        \ server-side session only after Core access validation. redirectUri must\
        \ match the original browser authorization flow."
      operationId: TokenController_validateToken_post__api_token
      requestBody:
        content:
          application/json:
            example:
              code: C1
              codeVerifier: EXAMPLE_ONLY_VERIFIER_012345678901234567890123456789
              redirectUri: http://localhost:4200/login/callback
            schema:
              $ref: "#/components/schemas/TokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                email: person@example.test
                name: Example Academy
                role: OWNER
                roles:
                - example
                username: example.user
              schema:
                $ref: "#/components/schemas/UserInfo"
          description: BFF user identity; no tokens returned
        "400":
          content:
            application/json:
              examples:
                INVALID_REQUEST:
                  description: Correct the request; do not retry unchanged.
                  summary: INVALID_REQUEST
                  value:
                    correlationId: 00000000-0000-4000-8000-000000000001
                    description: The request is invalid.
                    errorCode: INVALID_REQUEST
                    path: /api/token
                    status: 400
                    timestamp: 2026-01-01T00:00:00Z
                VALIDATION_FAILED:
                  description: Correct the request; do not retry unchanged.
                  summary: VALIDATION_FAILED
                  value:
                    correlationId: 00000000-0000-4000-8000-000000000001
                    description: The request contains invalid fields.
                    errorCode: VALIDATION_FAILED
                    fieldErrors:
                      field: Review the validation rule for this field.
                    path: /api/token
                    reasonCode: INVALID_REQUEST_FIELDS
                    status: 400
                    timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request rejected; see named examples for error codes and recovery
            guidance.
        "401":
          content:
            application/json:
              examples:
                AUTHENTICATION_FAILED:
                  description: Sign in again.
                  summary: AUTHENTICATION_FAILED
                  value:
                    correlationId: 00000000-0000-4000-8000-000000000001
                    description: Your sign-in session is invalid or expired. Please
                      sign in again.
                    errorCode: AUTHENTICATION_FAILED
                    path: /api/token
                    status: 401
                    timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request rejected; see named examples for error codes and recovery
            guidance.
        "403":
          content:
            application/json:
              examples:
                ACCESS_DENIED:
                  description: Use an authorized active account; do not change tenant
                    identifiers to bypass access.
                  summary: ACCESS_DENIED
                  value:
                    correlationId: 00000000-0000-4000-8000-000000000001
                    description: You do not have permission to perform this operation.
                    errorCode: ACCESS_DENIED
                    path: /api/token
                    status: 403
                    timestamp: 2026-01-01T00:00:00Z
                CUSTOMER_ACCESS_BLOCKED:
                  description: Use an authorized active account; do not change tenant
                    identifiers to bypass access.
                  summary: CUSTOMER_ACCESS_BLOCKED
                  value:
                    correlationId: 00000000-0000-4000-8000-000000000001
                    description: Your ArenaOps account does not currently have access.
                      Please contact your administrator.
                    errorCode: CUSTOMER_ACCESS_BLOCKED
                    path: /api/token
                    status: 403
                    timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request rejected; see named examples for error codes and recovery
            guidance.
        "415":
          content:
            application/json:
              examples:
                UNSUPPORTED_MEDIA_TYPE:
                  description: Correct the request; do not retry unchanged.
                  summary: UNSUPPORTED_MEDIA_TYPE
                  value:
                    correlationId: 00000000-0000-4000-8000-000000000001
                    description: This request format is not supported.
                    errorCode: UNSUPPORTED_MEDIA_TYPE
                    path: /api/token
                    status: 415
                    timestamp: 2026-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request rejected; see named examples for error codes and recovery
            guidance.
        "500":
