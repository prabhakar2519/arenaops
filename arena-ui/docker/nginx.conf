map $http_x_forwarded_proto $arena_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /arena-config.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }
  # Keycloak routing belongs to Caddy's realm allowlist; never proxy it here.
  location = /auth { return 404; }
  location /auth/ { return 404; }
  location /api/ {
    proxy_pass http://arena-login:7700;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $arena_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
  }
  location / { try_files $uri $uri/ /index.html; }
}
