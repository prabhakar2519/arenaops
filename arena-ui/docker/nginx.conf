server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /arena-config.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }
  # Keycloak routing belongs to Caddy's realm allowlist; never proxy it here.
  location = /auth { return 404; }
  location /auth/ { return 404; }
  # The shared edge owns API routing; never resolve a generic BFF name from here.
  location = /api { return 404; }
  location /api/ { return 404; }
  location / { try_files $uri $uri/ /index.html; }
}
