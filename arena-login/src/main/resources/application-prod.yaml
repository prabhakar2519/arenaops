server:
  servlet:
    session:
      cookie:
        secure: true

spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            redirect-uri: "${APP_BASE_URL}/login/callback"
        provider:
          keycloak:
            authorization-uri: "${KC_AUTH_URL}/realms/arena/protocol/openid-connect/auth"
            token-uri: "${KC_AUTH_URL}/realms/arena/protocol/openid-connect/token"
            jwk-set-uri: "${KC_AUTH_URL}/realms/arena/protocol/openid-connect/certs"
            user-info-uri: "${KC_AUTH_URL}/realms/arena/protocol/openid-connect/userinfo"

keycloak-admin:
  server-url: ${KEYCLOAK_SERVER_URL}
  client-secret: ${KEYCLOAK_BFF_SECRET}

arena:
  core:
    url: ${ARENA_CORE_URL}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
